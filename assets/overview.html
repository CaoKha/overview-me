<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<!--
  Page for the PR overview and the codebase overview, rendered by `overview-me page` (src/page.rs).
  This file is the shell. src/page.rs inlines assets/styles/*.css into STYLE and assets/scripts/*.js
  into SCRIPT, in the order it lists, and fills in the title, markdown, config and code placeholders.
  The script files share one module scope: they are parts of one script, not ES modules. See
  assets/README.md.

  The markdown is turned into a review sheet: one section per `##` with a sticky section bar,
  tables in cards, node ids (N3) as chips, `path:line` linked to the forge with embedded code
  previews, "### Before" / "### After" side by side, and ```flow blocks drawn as lane diagrams.
  Works as a Claude artifact (inline styles, pinned CDN scripts, Google Fonts) and as a local file.
-->
<style>
{{STYLE}}</style>
</head>
<body>
<main id="out"></main>
<script type="text/markdown" id="md">{{MD}}</script>
<script type="application/json" id="config">{{CONFIG}}</script>
<script type="application/json" id="code">{{CODE}}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module">
{{SCRIPT}}</script>
</body>
</html>
