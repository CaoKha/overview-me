<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<!--
  Page for the PR overview, the codebase overview and the plain review guide, rendered by
  `overview-me page` (src/page.rs), which fills in the title, markdown and config placeholders. The markdown is turned into a review sheet:
  one section per `##`, tables in cards, node ids (N3) as chips, `path:line` linked to the forge,
  "### Before" / "### After" side by side, and ```flow blocks drawn as lane diagrams: hovering a box
  traces its edges, clicking it pins it and lists its files with copy buttons. Works as a Claude artifact (inline styles, pinned CDN script, Google Fonts)
  and as a local file in the browser.
-->
<style>
:root {
  color-scheme: light;
  --bg: #F6F7F4; --card: #FFFFFF; --popover: #EEF0EA; --border: #D9DCD3;
  --fg: #151514; --accent: #5F625B; --muted: #8A8D85; --edge: #A9ADA3;
  --hl: #3D6B00;
  --ok: #3D6B00; --ok-bg: #E4F5CC;
  --warn: #9A6A00; --warn-bg: #FFF2CC;
  --bad: #C21F37; --bad-bg: #FDE3E7;
  --id: #B8640A; --id-bg: #FBEBD6;
  --link: #2F5F9E;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --card: #151514; --popover: #242523; --border: #333531;
    --fg: #F2F3EF; --accent: #A3A69D; --muted: #71746D; --edge: #575954;
    --hl: #9FF625;
    --ok: #9FF625; --ok-bg: #183201;
    --warn: #F5C451; --warn-bg: #2E2405;
    --bad: #F43F56; --bad-bg: #3A0C14;
    --id: #F7931A; --id-bg: #2E1C05;
    --link: #7FB2F0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --card: #151514; --popover: #242523; --border: #333531;
  --fg: #F2F3EF; --accent: #A3A69D; --muted: #71746D; --edge: #575954;
  --hl: #9FF625;
  --ok: #9FF625; --ok-bg: #183201;
  --warn: #F5C451; --warn-bg: #2E2405;
  --bad: #F43F56; --bad-bg: #3A0C14;
  --id: #F7931A; --id-bg: #2E1C05;
  --link: #7FB2F0;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); overflow-x: clip;
  font-family: var(--font-sans); font-size: 15px; line-height: 1.6;
  padding: 40px 16px 64px;
}
main { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
header { display: flex; flex-direction: column; gap: 12px; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
section > * { margin: 0; }
.tag { font-size: 11.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 30px; line-height: 1.2; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
h3 { font-size: 15px; font-weight: 600; margin: 8px 0 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
p { margin: 0; }
section > p { max-width: 72ch; }
section[data-name="in one paragraph"] > p { font-size: 16.5px; line-height: 1.65; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a code { color: inherit; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--popover); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { margin: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; overflow: auto; }
pre code { background: none; padding: 0; overflow-wrap: normal; }
blockquote { margin: 0; padding: 0 14px; border-left: 3px solid var(--border); color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--border); margin: 0; }
strong { font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); }
.meta span { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
.n { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--id); background: var(--id-bg); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.ok { color: var(--ok); background: var(--ok-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
h3 .chip { text-transform: uppercase; letter-spacing: 0.04em; }

/* Lists: plain bullets; numbered steps; cards for entry points, open questions and gaps; read-first cards. */
ul, ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
li > ul, li > ol { margin-top: 6px; }
ol.steps, ul.cards, ol.read { padding: 0; list-style: none; gap: 10px; }
ol.steps { counter-reset: s; }
ol.steps > li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
ol.steps > li::before { content: counter(s); font-family: var(--font-mono); font-size: 12px; color: var(--accent); border: 1px solid var(--border); border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; margin-top: 1px; }
ul.cards > li { padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); min-width: 0; }
ol.read { counter-reset: r; }
ol.read > li { counter-increment: r; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); }
ol.read > li::before { content: counter(r); font-size: 22px; font-weight: 600; color: var(--hl); line-height: 1.2; }
li > div { min-width: 0; }

/* Tables in a card that scrolls sideways on a narrow screen. */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--border); }
th { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--popover); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

/* "### Before" and "### After": stacked, side by side and wider than the column on a wide screen. */
.compare { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 1500px) {
  .compare { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; width: min(1640px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%); }
  /* Both panels share the title, diagram and text rows, so the text under each diagram starts at the same height. */
  .compare > .panel { display: grid; grid-row: span 3; grid-template-rows: subgrid; align-content: start; }
  .compare > .panel > .panel-fig { grid-row: 2; }
  .compare > .panel > .panel-body { grid-row: 3; }
}
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel > * { margin: 0; }
.panel-fig, .panel-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-fig:empty { display: none; }
.panel-body > * { margin: 0; }
.panel h3 { margin: 0; }
.panel ol.steps > li { font-size: 14px; }

/* Flow diagrams: lanes in tiers, boxes, SVG edges; hover or focus a box to trace its edges. */
.flow { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.arch-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); }
.arch { position: relative; min-width: 560px; padding: 18px; display: flex; flex-direction: column; gap: 46px; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.edges path.line { fill: none; stroke: var(--edge); stroke-width: 1.5; transition: opacity .15s, stroke .15s; }
.edges path.line.added { stroke: var(--ok); }
.edges path.line.removed { stroke: var(--bad); stroke-dasharray: 5 4; }
.edges path.line.dashed { stroke-dasharray: 5 4; }
.edges path.line.on { stroke: var(--hl); stroke-width: 2; }
.arch.focus .edges path.line:not(.on) { opacity: 0.12; }
.tier { display: flex; gap: 14px; position: relative; z-index: 1; }
.lane { flex: 1 1 0; min-width: 0; border: 1px dashed var(--border); border-radius: 10px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--bg) 55%, transparent); }
.lane-name { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
/* Wide column gap for side arrows; a wrapped row keeps room for arrows and labels between rows. */
.lane-boxes { display: flex; flex-wrap: wrap; gap: 36px 56px; }
.lane-note { font-size: 13px; color: var(--accent); font-style: italic; }
.box { font-size: 15px; font-weight: 500; line-height: 1.3; padding: 8px 12px; border: 1px solid var(--fg); border-radius: 6px; background: var(--card); color: var(--fg); transition: border-color .15s, opacity .15s; cursor: pointer; }
.box.existing { border: 1px dashed var(--muted); font-weight: 400; }
.box.added { border: 2px solid var(--ok); }
.box.removed { border: 1.5px dashed var(--bad); color: var(--bad); }
.box.removed .label { text-decoration: line-through; }
.box.store { border-radius: 14px; font-family: var(--font-mono); font-size: 13.5px; }
.box .n { margin-right: 6px; }
.arch.focus .box:not(.near) { opacity: 0.35; }
.box.near { border-color: var(--hl); }
.box:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.box.pinned { box-shadow: 0 0 0 2px var(--hl); }
.edge-label { position: absolute; z-index: 2; transform: translate(-50%, -50%); font-family: var(--font-mono); font-size: 12px; color: var(--accent); background: var(--card); padding: 0 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; transition: opacity .15s; }
.edge-label.added { color: var(--ok); }
.edge-label.removed { color: var(--bad); }
.arch.focus .edge-label:not(.on) { opacity: 0.15; }
.edge-label.on { color: var(--hl); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--accent); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 12px; border-radius: 3px; border: 1px solid var(--fg); background: var(--card); }
.legend i.existing { border: 1px dashed var(--muted); }
.legend i.added { border: 2px solid var(--ok); }
.legend i.removed { border: 1.5px dashed var(--bad); }
.flow-error { color: var(--bad); font-size: 14px; }
/* The clicked box: what it is and its files, ready to copy into an editor's file search. */
.detail { border: 1px solid var(--border); border-radius: var(--r); background: var(--card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.detail[hidden] { display: none; }
.detail-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.detail-kind { font-size: 12px; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.detail-head .close { margin-left: auto; }
.detail-note { color: var(--accent); font-size: 14px; }
.detail ul.paths { list-style: none; padding: 0; gap: 6px; }
.detail ul.paths li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.detail ul.paths code { flex: 0 1 auto; min-width: 0; user-select: all; }
.detail .none { color: var(--muted); font-size: 14px; }
button.btn { font: 500 12px var(--font-sans); padding: 2px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--popover); color: var(--fg); cursor: pointer; white-space: nowrap; }
button.btn:hover { border-color: var(--accent); }
button.btn:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
.detail a.open { font-size: 12px; white-space: nowrap; }
pre.mermaid { background: var(--card); text-align: center; }
pre.mermaid svg { max-width: none; }

@media (max-width: 640px) {
  body { padding-block: 24px 48px; }
  h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { .box, .edges path.line, .edge-label { transition: none; } }
</style>
</head>
<body>
<main id="out"></main>
<script type="text/markdown" id="md">{{MD}}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
// forge: https web URL of the repo or null; sha: commit of the `path:line` references or null
// (then read from "sha <40 hex>" in the header line); base: commit for references under Before.
const cfg = {{CONFIG}};
const md = document.getElementById('md').textContent.replace(/<\\(\/script|!--)/gi, '<$1');
const out = document.getElementById('out');
out.innerHTML = marked.parse(md);

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const shortSha = (s) => s.replace(/\b([0-9a-f]{10})[0-9a-f]{30}\b/g, '$1…');

// Header: "# Name · kind" becomes a tag line over the title; the "a · b · c" line under it, pills.
const h1 = out.querySelector('h1');
if (h1) {
  const header = el('header');
  h1.before(header);
  const parts = h1.textContent.split(' · ');
  if (parts.length > 1) {
    header.append(el('span', 'tag', parts.pop()));
    h1.textContent = parts.join(' · ');
  }
  header.append(h1);
  const meta = header.nextElementSibling;
  if (meta && meta.tagName === 'P' && meta.textContent.includes(' · ')) {
    const pills = el('div', 'meta');
    for (const p of meta.textContent.split(' · ')) pills.append(el('span', null, shortSha(p.trim())));
    meta.remove();
    header.append(pills);
  }
}

// One section per `##`, named by its heading for section-specific styles.
for (const h2 of out.querySelectorAll('h2')) {
  const sec = el('section');
  sec.dataset.name = h2.textContent.trim().toLowerCase();
  const nodes = [h2];
  for (let n = h2.nextElementSibling; n && n.tagName !== 'H2'; n = n.nextElementSibling) nodes.push(n);
  h2.before(sec);
  sec.append(...nodes);
}

// "### Before …" and "### After …": a panel each, with what follows up to the next heading; a
// Before panel followed by an After panel goes into one row.
for (const h of out.querySelectorAll('h3')) {
  const m = h.textContent.match(/^(before|after)\b/i);
  if (!m) continue;
  const kind = m[1].toLowerCase();
  const nodes = [h];
  for (let n = h.nextElementSibling; n && !/^H[1-3]$/.test(n.tagName); n = n.nextElementSibling) nodes.push(n);
  const panel = el('div', `panel ${kind}`);
  h.before(panel);
  // Three parts (title, diagram, text) so side-by-side panels can share row heights.
  const fig = el('div', 'panel-fig');
  const body = el('div', 'panel-body');
  const rest = nodes.slice(1);
  if (rest[0]?.matches('pre')) fig.append(rest.shift());
  body.append(...rest);
  panel.append(h, fig, body);
  h.innerHTML = h.innerHTML.replace(/^(before|after)\b\s*[:—-]?\s*/i, '');
  h.prepend(el('span', `chip ${kind === 'before' ? 'bad' : 'ok'}`, kind));
}
for (const before of out.querySelectorAll('.panel.before')) {
  const after = before.nextElementSibling;
  if (!after || !after.matches('.panel.after')) continue;
  const row = el('div', 'compare');
  before.before(row);
  row.append(before, after);
}

// Lists: numbered lists are steps, except Read first; Entry points, Open questions and Gaps are cards.
const listKind = { 'entry points': 'cards', 'open questions': 'cards', gaps: 'cards', 'read first': 'read' };
for (const list of out.querySelectorAll('section ul, section ol')) {
  if (list.parentElement.closest('li')) continue;
  const kind = listKind[list.closest('section').dataset.name];
  if (list.tagName === 'OL') list.classList.add(kind === 'read' ? 'read' : 'steps');
  else if (kind === 'cards') list.classList.add('cards');
}
for (const li of out.querySelectorAll('ol.steps > li, ol.read > li')) {
  const d = el('div');
  d.append(...li.childNodes);
  li.append(d);
}

// Tables in cards; a cell that starts with ✓, ⚠ or ✗ becomes a status chip.
for (const t of out.querySelectorAll('table')) {
  const wrap = el('div', 'table-wrap');
  t.before(wrap);
  wrap.append(t);
}
for (const td of out.querySelectorAll('td')) {
  const s = td.textContent.trim();
  const k = s.startsWith('✓') ? 'ok' : s.startsWith('⚠') ? 'warn' : s.startsWith('✗') ? 'bad' : null;
  if (!k) continue;
  const chip = el('span', `chip ${k}`);
  chip.append(...td.childNodes);
  td.append(chip);
}

// Node ids (N3) in prose and tables become chips.
const walker = document.createTreeWalker(out, NodeFilter.SHOW_TEXT, {
  acceptNode: (t) => /\bN\d+\b/.test(t.data) && !t.parentElement.closest('code, pre, a, h1, .n')
    ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
});
const texts = [];
while (walker.nextNode()) texts.push(walker.currentNode);
for (const t of texts) {
  const frag = document.createDocumentFragment();
  let last = 0;
  for (const m of t.data.matchAll(/\bN\d+\b/g)) {
    frag.append(t.data.slice(last, m.index), el('span', 'n', m[0]));
    last = m.index + m[0].length;
  }
  frag.append(t.data.slice(last));
  t.replaceWith(frag);
}

// `path:line` code spans link to the forge at the overview's sha, or at base under Before.
const sha = cfg.sha || (md.match(/\bsha\s+([0-9a-f]{40})\b/) || [])[1];
const PATH_RE = /^([\w.@\/$\[\]{}()+-]+\.[\w]+|[\w.@$\[\]{}()+-]+(?:\/[\w.@$\[\]{}()+-]+)+)(?::(\d+)(?:-(\d+))?)?$/;
// Forge URL of "path" or "path:line" or "path:start-end", or null; `node` decides head or base.
function forgeHref(text, node) {
  const m = text.match(PATH_RE);
  const at = cfg.base && node.closest('.panel.before') ? cfg.base : sha;
  if (!m || !cfg.forge || !at) return null;
  const lines = m[2] ? `#L${m[2]}${m[3] ? `-L${m[3]}` : ''}` : '';
  return `${cfg.forge}/blob/${at}/${m[1]}${lines}`;
}
for (const code of out.querySelectorAll(':not(pre) > code')) {
  if (!/:\d+(-\d+)?$/.test(code.textContent)) continue;
  const href = forgeHref(code.textContent, code);
  if (!href) continue;
  const a = el('a');
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  code.replaceWith(a);
  a.append(code);
}

// Copies text; falls back to a selected textarea where the clipboard API is blocked (iframes).
async function copy(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = el('textarea');
    t.value = text;
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.append(t);
    t.select();
    document.execCommand('copy');
    t.remove();
  }
  const was = button.textContent;
  button.textContent = 'Copied';
  setTimeout(() => { button.textContent = was; }, 1200);
}

// ```flow blocks: {"nodes": {id: {label, n?, kind?, note?, paths?}}, "tiers": [[{name, ids, note?, flex?}]],
// "edges": [[from, to, label?, style?]]}. kind: existing | added | removed, plus store; style:
// dashed | added | removed.
const NS = 'http://www.w3.org/2000/svg';
let uid = 0;
const nodeKind = (n) => ['removed', 'added', 'existing'].find((k) => (n.kind || '').split(/\s+/).includes(k)) || 'changed';

function legend(spec) {
  const kinds = new Set(Object.values(spec.nodes).map(nodeKind));
  const box = el('div', 'legend');
  if (['existing', 'added', 'removed'].some((k) => kinds.has(k))) {
    for (const [k, text] of [['changed', 'changed by this branch'], ['added', 'new'], ['removed', 'removed'], ['existing', 'unchanged']]) {
      if (!kinds.has(k)) continue;
      const s = el('span');
      s.append(el('i', k), text);
      box.append(s);
    }
  }
  box.append(el('span', null, 'Hover a box to trace its links; click it for its files.'));
  return box;
}

function drawFlow(arch, spec, detail) {
  uid += 1;
  const id = uid;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'edges');
  svg.setAttribute('aria-hidden', 'true');
  const marker = (name, color) => `<marker id="${name}${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(${color})"></path></marker>`;
  svg.innerHTML = `<defs>${marker('a', '--edge')}${marker('h', '--hl')}${marker('g', '--ok')}${marker('r', '--bad')}</defs>`;
  arch.append(svg);

  const boxes = {};
  for (const tier of spec.tiers) {
    const t = el('div', 'tier');
    for (const lane of tier) {
      const l = el('div', 'lane');
      if (lane.flex) l.style.flex = lane.flex;
      l.append(el('span', 'lane-name', lane.name));
      const bx = el('div', 'lane-boxes');
      for (const nid of lane.ids) {
        const n = spec.nodes[nid];
        if (!n || boxes[nid]) continue;
        const b = el('div', `box ${n.kind || ''}`.trim());
        b.tabIndex = 0;
        if (n.n) b.append(el('span', 'n', n.n));
        b.append(el('span', 'label', n.label));
        bx.append(b);
        boxes[nid] = b;
      }
      l.append(bx);
      if (lane.note) l.append(el('span', 'lane-note', lane.note));
      t.append(l);
    }
    arch.append(t);
  }

  const edges = spec.edges.filter((e) => boxes[e[0]] && boxes[e[1]] && e[0] !== e[1]);
  const restMarker = (e) => (e[3] === 'added' ? 'g' : e[3] === 'removed' ? 'r' : 'a');
  const paths = [];
  const labels = [];
  edges.forEach((e, i) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('class', `line ${e[3] || ''}`.trim());
    p.setAttribute('marker-end', `url(#${restMarker(e)}${id})`);
    svg.append(p);
    paths.push(p);
    if (e[2]) {
      const lb = el('span', `edge-label ${e[3] || ''}`.trim(), e[2]);
      arch.append(lb);
      labels[i] = lb;
    }
  });

  function draw() {
    const base = arch.getBoundingClientRect();
    svg.setAttribute('width', base.width);
    svg.setAttribute('height', base.height);
    const R = {};
    for (const k of Object.keys(boxes)) {
      const r = boxes[k].getBoundingClientRect();
      R[k] = { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height };
    }
    // Each edge leaves and enters a box side; edges sharing a side spread along it.
    const ports = {};
    edges.forEach((e, i) => {
      const a = R[e[0]], b = R[e[1]];
      const acy = a.y + a.h / 2, bcy = b.y + b.h / 2;
      let sa, sb;
      if (Math.abs(acy - bcy) < 8) [sa, sb] = a.x < b.x ? ['right', 'left'] : ['left', 'right'];
      else [sa, sb] = bcy > acy ? ['bottom', 'top'] : ['top', 'bottom'];
      for (const [nid, side, other, self] of [[e[0], sa, b, 0], [e[1], sb, a, 1]]) {
        (ports[`${nid}:${side}`] ||= []).push({ i, other, self });
      }
    });
    const pos = {};
    for (const key of Object.keys(ports)) {
      const [nid, side] = key.split(':');
      const r = R[nid];
      const list = ports[key];
      const horiz = side === 'top' || side === 'bottom';
      list.sort((p, q) => (horiz ? (p.other.x + p.other.w / 2) - (q.other.x + q.other.w / 2) : p.other.y - q.other.y));
      list.forEach((p, k) => {
        const f = (k + 1) / (list.length + 1);
        const x = side === 'left' ? r.x : side === 'right' ? r.x + r.w : r.x + r.w * f;
        const y = side === 'top' ? r.y : side === 'bottom' ? r.y + r.h : r.y + r.h * f;
        pos[`${p.i}:${p.self}`] = { x, y, side };
      });
    }
    edges.forEach((e, i) => {
      const s = pos[`${i}:0`], t = pos[`${i}:1`];
      let ex = t.x, ey = t.y;
      if (t.side === 'top') ey -= 4; else if (t.side === 'bottom') ey += 4; else if (t.side === 'left') ex -= 4; else ex += 4;
      let d;
      if (s.side === 'top' || s.side === 'bottom') {
        const dy = Math.max(30, Math.abs(ey - s.y) / 2), sg = s.side === 'bottom' ? 1 : -1;
        d = `M${s.x},${s.y} C${s.x},${s.y + sg * dy} ${ex},${ey - sg * dy} ${ex},${ey}`;
      } else {
        const dx = Math.max(30, Math.abs(ex - s.x) / 2), sx = s.side === 'right' ? 1 : -1;
        d = `M${s.x},${s.y} C${s.x + sx * dx},${s.y} ${ex - sx * dx},${ey} ${ex},${ey}`;
      }
      paths[i].setAttribute('d', d);
      if (labels[i]) {
        const m = paths[i].getPointAtLength(paths[i].getTotalLength() / 2);
        labels[i].style.left = `${m.x}px`;
        labels[i].style.top = `${s.side === 'left' || s.side === 'right' ? m.y - 13 : m.y}px`;
      }
    });
  }

  function focusOn(nid) {
    arch.classList.add('focus');
    boxes[nid].classList.add('near');
    edges.forEach((e, i) => {
      const on = e[0] === nid || e[1] === nid;
      paths[i].classList.toggle('on', on);
      paths[i].setAttribute('marker-end', `url(#${on ? 'h' : restMarker(e)}${id})`);
      if (labels[i]) labels[i].classList.toggle('on', on);
      if (on) { boxes[e[0]].classList.add('near'); boxes[e[1]].classList.add('near'); }
    });
  }
  function clear() {
    arch.classList.remove('focus');
    for (const b of Object.values(boxes)) b.classList.remove('near');
    edges.forEach((e, i) => {
      paths[i].classList.remove('on');
      paths[i].setAttribute('marker-end', `url(#${restMarker(e)}${id})`);
      if (labels[i]) labels[i].classList.remove('on');
    });
  }
  // Click (or Enter) pins a box: its links stay traced and the panel lists its files.
  let pinned = null;
  function showDetail(k) {
    const n = spec.nodes[k];
    detail.replaceChildren();
    const head = el('div', 'detail-head');
    if (n.n) head.append(el('span', 'n', n.n));
    head.append(el('span', null, n.label));
    const kind = nodeKind(n);
    head.append(el('span', 'detail-kind', { changed: n.n ? 'changed' : '', added: 'new', removed: 'removed', existing: 'unchanged' }[kind]));
    const close = el('button', 'btn close', 'Close');
    close.type = 'button';
    close.addEventListener('click', unpin);
    head.append(close);
    detail.append(head);
    if (n.note) detail.append(el('p', 'detail-note', n.note));
    const paths = Array.isArray(n.paths) ? n.paths : [];
    if (!paths.length) detail.append(el('p', 'none', 'No file given for this box.'));
    else {
      const list = el('ul', 'paths');
      for (const p of paths) {
        const li = el('li');
        li.append(el('code', null, p));
        const b = el('button', 'btn', 'Copy');
        b.type = 'button';
        b.addEventListener('click', () => copy(p, b));
        li.append(b);
        const href = forgeHref(p, arch);
        if (href) {
          const a = el('a', 'open', 'open ↗');
          a.href = href;
          a.target = '_blank';
          a.rel = 'noopener';
          li.append(a);
        }
        list.append(li);
      }
      detail.append(list);
      if (paths.length > 1) {
        const all = el('button', 'btn', 'Copy all');
        all.type = 'button';
        all.style.alignSelf = 'flex-start';
        all.addEventListener('click', () => copy(paths.join('\n'), all));
        detail.append(all);
      }
    }
    detail.hidden = false;
  }
  function pin(k) {
    if (pinned) boxes[pinned].classList.remove('pinned');
    pinned = k;
    clear();
    focusOn(k);
    boxes[k].classList.add('pinned');
    showDetail(k);
  }
  function unpin() {
    if (!pinned) return;
    boxes[pinned].classList.remove('pinned');
    pinned = null;
    clear();
    detail.hidden = true;
  }
  for (const [k, b] of Object.entries(boxes)) {
    b.setAttribute('role', 'button');
    b.setAttribute('aria-label', `${spec.nodes[k].n ? `${spec.nodes[k].n} ` : ''}${spec.nodes[k].label}: show files`);
    b.addEventListener('mouseenter', () => { if (!pinned) focusOn(k); });
    b.addEventListener('mouseleave', () => { if (!pinned) clear(); });
    b.addEventListener('focus', () => { if (!pinned) focusOn(k); });
    b.addEventListener('blur', () => { if (!pinned) clear(); });
    b.addEventListener('click', (ev) => { ev.stopPropagation(); if (pinned === k) unpin(); else pin(k); });
    b.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (pinned === k) unpin(); else pin(k); }
      if (ev.key === 'Escape') unpin();
    });
  }
  arch.addEventListener('click', unpin);
  draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  if (window.ResizeObserver) new ResizeObserver(draw).observe(arch);
  else window.addEventListener('resize', draw);
}

for (const code of out.querySelectorAll('pre > code.language-flow')) {
  const pre = code.parentElement;
  let spec;
  try {
    spec = JSON.parse(code.textContent);
    if (!spec || typeof spec.nodes !== 'object' || !Array.isArray(spec.tiers)) throw new Error('needs "nodes" and "tiers"');
    spec.edges ||= [];
  } catch (err) {
    pre.before(el('p', 'flow-error', `Flow diagram not drawn: ${err.message}`));
    continue;
  }
  const flow = el('div', 'flow');
  const scroll = el('div', 'arch-scroll');
  const arch = el('div', 'arch');
  const detail = el('div', 'detail');
  detail.hidden = true;
  detail.setAttribute('aria-live', 'polite');
  scroll.append(arch);
  flow.append(scroll, legend(spec), detail);
  pre.replaceWith(flow);
  drawFlow(arch, spec, detail);
}

// Older overviews may still use mermaid; load it only when one is there.
const mermaidBlocks = out.querySelectorAll('pre > code.language-mermaid');
if (mermaidBlocks.length) {
  for (const code of mermaidBlocks) {
    const pre = code.parentElement;
    pre.className = 'mermaid';
    pre.textContent = code.textContent;
  }
  const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs');
  const theme = document.documentElement.dataset.theme;
  const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const font = getComputedStyle(document.body);
  mermaid.initialize({
    startOnLoad: false,
    theme: dark ? 'dark' : 'default',
    securityLevel: 'strict',
    themeVariables: { fontSize: font.fontSize, fontFamily: font.fontFamily },
    flowchart: { useMaxWidth: false },
  });
  await mermaid.run({ querySelector: 'pre.mermaid' });
}
</script>
</body>
</html>
