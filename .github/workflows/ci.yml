name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The same install the README gives users, so a green main means `cargo install` works.
      - name: cargo install
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/bin/overview-me" --version

  plugin:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The release a plugin version downloads is tagged from Cargo.toml's version.
      - name: Versions match
        run: |
          cargo_v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          plugin_v="$(jq -r .version .claude-plugin/plugin.json)"
          [ "$cargo_v" = "$plugin_v" ] || { echo "::error::Cargo.toml $cargo_v != plugin.json $plugin_v"; exit 1; }
      - name: Install script
        run: bash -n scripts/ensure-cli.sh && shellcheck scripts/ensure-cli.sh
      # Checks .claude-plugin/plugin.json, marketplace.json, hooks and the skills' frontmatter.
      - run: npx -y @anthropic-ai/claude-code plugin validate .
        env:
          DISABLE_TELEMETRY: "1"
