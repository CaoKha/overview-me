name: Release

# Push a tag `v<version>` (the version in Cargo.toml and .claude-plugin/plugin.json) to build the
# CLI for macOS and Linux and publish it as a GitHub release. The plugin's SessionStart hook
# downloads the asset that matches the plugin version. Run it by hand to build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Tag matches versions
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          plugin_v="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$tag" != "$cargo_v" ] || [ "$tag" != "$plugin_v" ]; then
            echo "::error::tag v$tag, Cargo.toml $cargo_v and plugin.json $plugin_v must match"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        # Static musl binaries run on any Linux; tree-sitter's C code needs musl-gcc for that.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="overview-me-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$name" overview-me
          shasum -a 256 "$name" > "$name.sha256"
          tar -xzOf "$name" overview-me > /dev/null
      - uses: actions/upload-artifact@v5
        with:
          name: overview-me-${{ matrix.target }}
          path: overview-me-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes -R "$GITHUB_REPOSITORY"
          fi
