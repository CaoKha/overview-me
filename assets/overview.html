<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<!--
  Page for the PR overview and the codebase overview, rendered by
  `overview-me page` (src/page.rs), which fills in the title, markdown, config and code placeholders. The markdown is turned into a review sheet:
  one section per `##` with a sticky section bar, tables in cards, node ids (N3) as chips, `path:line` linked to the forge with embedded code previews,
  "### Before" / "### After" side by side, and ```flow blocks drawn as lane diagrams: hovering a box
  traces its edges, clicking it pins it and lists its files in a draggable fixed side panel resizable from every edge and corner (a height-adjustable bottom sheet on phones) with copy buttons and vertically resizable inline code previews. Code previews open in the same panel; it has a word-wrap toggle, remembered per reader.
  Previewing a `path:line` elsewhere highlights the boxes that hold it and links to them from the preview. Works as a Claude artifact (inline styles, pinned CDN scripts, Google Fonts)
  and as a local file in the browser.
-->
<style>
:root {
  color-scheme: light;
  --bg: #F6F7F4; --card: #FFFFFF; --popover: #EEF0EA; --border: #D9DCD3;
  --fg: #151514; --accent: #5F625B; --muted: #8A8D85; --edge: #A9ADA3;
  --hl: #3D6B00;
  --ok: #3D6B00; --ok-bg: #E4F5CC;
  --warn: #9A6A00; --warn-bg: #FFF2CC;
  --bad: #C21F37; --bad-bg: #FDE3E7;
  --id: #B8640A; --id-bg: #FBEBD6;
  --link: #2F5F9E;
  --secondary: #E3E5DF; --on-hl: #FFFFFF;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px; --r-block: 12px;
  --bar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --card: #151514; --popover: #242523; --border: #333531;
    --fg: #F2F3EF; --accent: #A3A69D; --muted: #71746D; --edge: #575954;
    --hl: #9FF625;
    --ok: #9FF625; --ok-bg: #183201;
    --warn: #F5C451; --warn-bg: #2E2405;
    --bad: #F43F56; --bad-bg: #3A0C14;
    --id: #F7931A; --id-bg: #2E1C05;
    --link: #7FB2F0;
    --secondary: #333531; --on-hl: #000000;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --card: #151514; --popover: #242523; --border: #333531;
  --fg: #F2F3EF; --accent: #A3A69D; --muted: #71746D; --edge: #575954;
  --hl: #9FF625;
  --ok: #9FF625; --ok-bg: #183201;
  --warn: #F5C451; --warn-bg: #2E2405;
  --bad: #F43F56; --bad-bg: #3A0C14;
  --id: #F7931A; --id-bg: #2E1C05;
  --link: #7FB2F0;
  --secondary: #333531; --on-hl: #000000;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); overflow-x: clip;
  font-family: var(--font-sans); font-size: 15px; line-height: 1.6;
  padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 1640px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.content { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
header { display: flex; flex-direction: column; gap: 12px; }
section { display: flex; flex-direction: column; gap: 16px; min-width: 0; scroll-margin-top: calc(var(--bar) + 16px + env(safe-area-inset-top, 0px)); }
section > * { margin: 0; }
.tag { font-size: 11.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 32px; line-height: 1.2; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 18px; line-height: 1.3; font-weight: 600; letter-spacing: -0.005em; color: var(--fg); margin: 0; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; margin: 8px 0 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
p { margin: 0; }
/* Sections share the flow's width; running text keeps a readable line length. */
section > p { max-width: 80ch; }
section > ul:not(.cards), section > ol:not(.read) { max-width: 100ch; }
section[data-name="in one paragraph"] > p { font-size: 16.5px; line-height: 1.65; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a code { color: inherit; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--popover); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { margin: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; overflow: auto; }
pre code { background: none; padding: 0; overflow-wrap: normal; }
blockquote { margin: 0; padding: 0 14px; border-left: 3px solid var(--border); color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--border); margin: 0; }
strong { font-weight: 600; }
.facts { display: flex; flex-wrap: wrap; gap: 0; margin-top: 8px; background: var(--card); border-radius: var(--r-block); padding-block: 12px; }
.fact { display: flex; flex-direction: column; gap: 2px; padding: 0 20px; min-width: 0; }
.fact + .fact { border-left: 1px solid var(--border); }
.fact-label { font-size: 12px; color: var(--accent); }
.fact-value { font-family: var(--font-mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.n { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--id); background: var(--id-bg); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.ok { color: var(--ok); background: var(--ok-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.chip.note { color: var(--id); background: var(--id-bg); }
h3 .chip, .chip.callout { text-transform: uppercase; letter-spacing: 0.04em; }
.chip.callout { font-size: 11px; margin-right: 6px; vertical-align: 1px; border-radius: 4px; }

/* Lists: plain bullets; numbered steps; cards for entry points, open questions and gaps; read-first cards. */
ul, ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
li > ul, li > ol { margin-top: 6px; }
ol.steps, ul.cards, ol.read { padding: 0; list-style: none; gap: 10px; }
ol.steps { counter-reset: s; }
ol.steps > li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
ol.steps > li::before { content: counter(s); font-family: var(--font-mono); font-size: 12px; color: var(--accent); border: 1px solid var(--border); border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; margin-top: 1px; }
ul.cards > li { padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); min-width: 0; }
ol.read { counter-reset: r; }
ol.read > li { counter-increment: r; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); }
ol.read > li::before { content: counter(r); font-size: 22px; font-weight: 600; color: var(--hl); line-height: 1.2; }
li > div { min-width: 0; }

/* Tables in a card that scrolls sideways on a narrow screen. */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--border); }
th { font-size: 12px; font-weight: 500; color: var(--accent); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

/* "### Before" and "### After": stacked, side by side on a wide screen. */
.compare { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 1500px) {
  .compare { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
  /* Both panels share the title, diagram and text rows, so the text under each diagram starts at the same height. */
  .compare > .panel { display: grid; grid-row: span 3; grid-template-rows: subgrid; align-content: start; }
  .compare > .panel > .panel-fig { grid-row: 2; }
  .compare > .panel > .panel-body { grid-row: 3; }
}
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel > * { margin: 0; }
.panel-fig, .panel-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-fig:empty { display: none; }
.panel-body > * { margin: 0; }
.panel h3 { margin: 0; }
.panel ol.steps > li { font-size: 14px; }

/* Flow diagrams: lanes in tiers, boxes, SVG edges; hover or focus a box to trace its edges. */
.flow { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.arch-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); }
.arch { position: relative; min-width: 560px; padding: 18px; display: flex; flex-direction: column; gap: 46px; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.edges path.line { fill: none; stroke: var(--edge); stroke-width: 1.5; transition: opacity .15s, stroke .15s; }
.edges path.line.added { stroke: var(--ok); }
.edges path.line.removed { stroke: var(--bad); stroke-dasharray: 5 4; }
.edges path.line.dashed { stroke-dasharray: 5 4; }
.edges path.line.on { stroke: var(--hl); stroke-width: 2; }
.arch.focus .edges path.line:not(.on) { opacity: 0.12; }
.tier { display: flex; gap: 14px; position: relative; z-index: 1; }
.lane { flex: 1 1 0; min-width: 0; border: 1px dashed var(--border); border-radius: 10px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--bg) 55%, transparent); }
.lane-name { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
/* Wide column gap for side arrows; a wrapped row keeps room for arrows and labels between rows. */
.lane-boxes { display: flex; flex-wrap: wrap; gap: 36px 56px; }
.lane-note { font-size: 13px; color: var(--accent); font-style: italic; }
.box { font-size: 15px; font-weight: 500; line-height: 1.3; padding: 8px 12px; border: 1px solid var(--fg); border-radius: 6px; background: var(--card); color: var(--fg); transition: border-color .15s, opacity .15s; cursor: pointer; }
.box.existing { border: 1px dashed var(--muted); font-weight: 400; }
.box.added { border: 2px solid var(--ok); }
.box.removed { border: 1.5px dashed var(--bad); color: var(--bad); }
.box.removed .label { text-decoration: line-through; }
.box.store { border-radius: 14px; font-family: var(--font-mono); font-size: 13.5px; }
.box .n { margin-right: 6px; }
.arch.focus .box:not(.near) { opacity: 0.35; }
.box.near { border-color: var(--hl); }
.box:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.box.pinned { box-shadow: 0 0 0 2px var(--hl); }
.box.located { border-color: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 35%, transparent); }
.box.located:focus-visible { outline-color: var(--warn); }
.edge-label { position: absolute; z-index: 2; transform: translate(-50%, -50%); font-family: var(--font-mono); font-size: 12px; color: var(--accent); background: var(--card); padding: 0 5px; border-radius: 4px; width: max-content; max-width: 90%; text-align: center; pointer-events: none; transition: opacity .15s; }
.edge-label.added { color: var(--ok); }
.edge-label.removed { color: var(--bad); }
.arch.focus .edge-label:not(.on) { opacity: 0.15; }
.edge-label.on { color: var(--hl); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--accent); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 12px; border-radius: 3px; border: 1px solid var(--fg); background: var(--card); }
.legend i.existing { border: 1px dashed var(--muted); }
.legend i.added { border: 2px solid var(--ok); }
.legend i.removed { border: 1.5px dashed var(--bad); }
.flow-error { color: var(--bad); font-size: 14px; }
/* Section bar: one pill per section, stuck to the top while scrolling; the section in view is filled. */
.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-block: -12px; padding-block: 8px; background: var(--bg); box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(0 -100vmax); }
.toc-track { display: flex; gap: 2px; width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 4px; background: var(--card); border-radius: 999px; }
.toc-track::-webkit-scrollbar { display: none; }
.toc a { flex-shrink: 0; font-size: 12px; font-weight: 500; line-height: 16px; padding: 6px 10px; border-radius: 999px; color: var(--accent); white-space: nowrap; }
.toc a:hover { color: var(--fg); text-decoration: none; }
.toc a[aria-current="true"] { background: var(--hl); color: var(--on-hl); }
.toc a:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
.toc-title { display: none; }
/* Wide screens: the sections as a list in a left rail, which the panels on the right never cover. */
@media (min-width: 1200px) {
  main { max-width: 1888px; display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 40px 48px; }
  main > header { grid-column: 2; }
  .content { grid-column: 2; }
  .toc { grid-column: 1; grid-row: 1 / 3; align-self: start; top: calc(24px + env(safe-area-inset-top, 0px)); margin: 0; padding: 0; background: none; box-shadow: none; clip-path: none; max-height: calc(100vh - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .toc-title { display: block; font-size: 12px; font-weight: 500; color: var(--accent); }
  .toc-track { flex-direction: column; gap: 0; width: auto; padding: 0; background: none; border-radius: 0; border-left: 1px solid var(--border); overflow: visible; }
  .toc a { font-size: 13px; line-height: 18px; padding: 6px 12px; margin-left: -1px; border-radius: 0; border-left: 2px solid transparent; white-space: normal; }
  .toc a[aria-current="true"] { background: none; color: var(--fg); border-left-color: var(--hl); }
  section { scroll-margin-top: calc(24px + env(safe-area-inset-top, 0px)); }
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
/* The clicked box: its files in a viewport side panel, or a bottom sheet on phones. */
.detail { position: fixed; top: var(--panel-top, 16px); left: var(--panel-left, auto); right: 16px; max-height: calc(100vh - 32px); overflow-y: auto; width: min(var(--panel-width, 440px), calc(100vw - 32px)); z-index: 10; border: 1px solid var(--border); border-radius: var(--r-block); background: var(--popover); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.detail[hidden] { display: none; }
.panel-resize { position: absolute; z-index: 1; touch-action: none; user-select: none; }
.panel-resize::after { content: ''; position: absolute; border-radius: var(--r); background: var(--accent); opacity: 0; }
.panel-resize:hover::after, .panel-resize:focus-visible::after { opacity: 1; }
.panel-resize:focus-visible { outline: 2px solid var(--hl); outline-offset: -2px; }
.panel-resize-n, .panel-resize-s { left: 16px; right: 16px; height: 6px; cursor: ns-resize; }
.panel-resize-n { top: 0; }
.panel-resize-s { bottom: 0; }
.panel-resize-n::after, .panel-resize-s::after { top: 1px; left: calc(50% - 16px); width: 32px; height: 3px; }
.panel-resize-e, .panel-resize-w { top: 6px; bottom: 16px; width: 6px; cursor: ew-resize; }
.panel-resize-e { right: 0; }
.panel-resize-w { left: 0; }
.panel-resize-e::after, .panel-resize-w::after { top: 24px; left: 1px; width: 3px; height: 32px; }
.panel-resize-ne, .panel-resize-nw, .panel-resize-se, .panel-resize-sw { width: 16px; height: 16px; }
.panel-resize-ne, .panel-resize-nw { top: 0; height: 6px; }
.panel-resize-se, .panel-resize-sw { bottom: 0; }
.panel-resize-ne, .panel-resize-se { right: 0; }
.panel-resize-nw, .panel-resize-sw { left: 0; }
.panel-resize-nw, .panel-resize-se { cursor: nwse-resize; }
.panel-resize-ne, .panel-resize-sw { cursor: nesw-resize; }
.panel-resize:is(.panel-resize-ne, .panel-resize-nw, .panel-resize-se, .panel-resize-sw)::after { inset: 1px; border: 2px solid var(--accent); background: none; }
.detail-body { display: contents; }
@media (min-width: 641px) {
  .detail { height: var(--panel-height, auto); max-height: min(calc(100vh - 32px), calc(100vh - var(--panel-top, 16px) - 16px)); overflow: hidden; }
  .detail > .detail-head { flex-shrink: 0; }
  .detail-body { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }
  :root.panel-sized .detail pre.code { resize: none; }
  :root.panel-sized .detail > pre.code { flex: 1; min-height: 0; max-height: none; }
  :root.panel-sized .detail.single-preview .detail-body,
  :root.panel-sized .detail.single-preview ul.paths,
  :root.panel-sized .detail.single-preview li:has(pre.code) { flex: 1; min-height: 0; }
  :root.panel-sized .detail.single-preview ul.paths > li:not(:has(pre.code)) { flex-shrink: 0; }
  :root.panel-sized .detail.single-preview li:has(pre.code) { display: grid; grid-template-columns: auto auto auto 1fr; grid-template-rows: auto minmax(0, 1fr); }
  :root.panel-sized .detail.single-preview ul.paths pre.code { grid-column: 1 / -1; align-self: stretch; width: auto; height: auto; min-height: 0; }
}
.detail-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; cursor: grab; touch-action: none; }
.detail.dragging { user-select: none; }
.detail.dragging .detail-head { cursor: grabbing; }
.detail-kind { font-size: 12px; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.detail-head .close { margin-left: auto; }
.detail-note { color: var(--accent); font-size: 14px; }
.detail ul.paths { list-style: none; padding: 0; gap: 6px; }
.detail ul.paths li { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.detail ul.paths pre.code { flex-basis: 100%; width: 0; height: 320px; max-height: none; resize: vertical; }
.detail ul.paths code { flex: 0 1 auto; min-width: 0; user-select: all; }
.detail code { background: var(--card); }
.detail .none { color: var(--muted); font-size: 14px; }
button.btn { font: 500 12px/1.5 var(--font-sans); padding: 3px 10px; border: 0; border-radius: var(--r); background: var(--secondary); color: var(--fg); cursor: pointer; white-space: nowrap; }
button.btn:hover { opacity: 0.85; }
/* Quiet icon buttons: the preview eye in the text (so long paragraphs and tables stay readable)
   and the panel tools. Ghost until hovered, filled while on. */
.peek, .icon-btn { display: inline-grid; place-items: center; flex-shrink: 0; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--accent); cursor: pointer; transition: color 120ms, background-color 120ms; }
.peek { width: 22px; height: 22px; margin-left: 2px; vertical-align: -6px; }
:is(.peek, .icon-btn):hover { color: var(--fg); background: var(--secondary); text-decoration: none; }
:is(.peek, .icon-btn):is([aria-expanded="true"], [aria-pressed="true"]) { color: var(--on-hl); background: var(--hl); }
:is(.peek, .icon-btn):focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
.peek svg { width: 15px; height: 15px; }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn svg.check { color: var(--ok); }
.detail-head .tools { display: flex; align-items: center; gap: 2px; margin-left: auto; padding-right: 8px; border-right: 1px solid var(--border); }
.detail-head .tools + .close { margin-left: 0; }
button.btn:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
.flow-hits { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; flex-shrink: 0; font-size: 12px; color: var(--muted); }
.flow-hits .n { margin-right: 5px; padding: 0 4px; }
.detail:has(pre.code) { width: min(var(--panel-width, 760px), calc(100vw - 32px)); }
pre.code { max-height: calc(100vh - 120px); min-height: 0; padding: 8px 0; font: 12px/1.6 var(--font-mono); }
pre.code .code-line { display: block; min-width: max-content; padding-right: 12px; }
pre.code .code-line.cited { background: color-mix(in srgb, var(--hl) 14%, transparent); }
pre.code .line-number { display: inline-block; width: 4.5em; padding-right: 12px; text-align: right; color: var(--muted); user-select: none; }
/* Word wrap: wrapped rows hang under the code, not the line number. */
:root.code-wrap pre.code .code-line { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 4.5em; text-indent: -4.5em; }
:root.code-wrap pre.code .line-number { text-indent: 0; }
pre.code :is(.hljs-keyword, .hljs-built_in, .hljs-selector-tag) { color: var(--link); }
pre.code :is(.hljs-string, .hljs-regexp, .hljs-addition) { color: var(--ok); }
pre.code :is(.hljs-comment, .hljs-quote) { color: var(--muted); font-style: italic; }
pre.code :is(.hljs-number, .hljs-literal, .hljs-symbol, .hljs-variable.constant_) { color: var(--id); }
pre.code :is(.hljs-title, .hljs-section) { color: var(--warn); }
pre.code :is(.hljs-type, .hljs-meta, .hljs-attr, .hljs-attribute, .hljs-params) { color: var(--accent); }

  const a = el('a', 'icon-btn');
  a.innerHTML = EXTERNAL;
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  a.title = 'Open in a new tab';
  a.setAttribute('aria-label', 'Open in a new tab');
  return a;
}
// Opens the side panel with `title` and its tools in the head (wrap when it can show code, open
// when there is a link, close) and `body` below. `onClose` runs while the panel is still open.
// Returns the close button.
function showPanel({ label, title, href, wrap, live, body, onClose }) {
  closePanel?.();
  const head = el('div', 'detail-head');
  head.append(...title);
  const tools = el('div', 'tools');
  if (wrap) {
    const b = iconButton(WRAP, 'Wrap long lines');
    b.setAttribute('aria-pressed', String(document.documentElement.classList.contains('code-wrap')));
    b.addEventListener('click', () => {
      const on = document.documentElement.classList.toggle('code-wrap');
      b.setAttribute('aria-pressed', String(on));
      try { localStorage.setItem(codeWrapKey, on ? '1' : '0'); } catch {}
      sidePanel.querySelectorAll('pre.code').forEach(scrollCode);
    });
    tools.append(b);
  }
  if (href) tools.append(openLink(href));
  if (tools.children.length) head.append(tools);
  const close = iconButton(CLOSE, 'Close (Esc)');
  close.classList.add('close');
  close.addEventListener('click', () => closePanel());
  head.append(close);
  sidePanel.setAttribute('aria-label', label);
  sidePanel.setAttribute('aria-live', live ? 'polite' : 'off');
  sidePanel.classList.remove('single-preview');
  sidePanel.replaceChildren(...panelGrips, head, ...body);
  sidePanel.hidden = false;
  closePanel = () => {
    closePanel = null;
    onClose();
    sidePanel.hidden = true;
    sidePanel.replaceChildren();
  };
  return close;
}
function showCode(text, preview, href, button, before) {
  // The same button again closes its preview.
  const open = button.getAttribute('aria-expanded') === 'true';
  closePanel?.();
  if (open) return;
  const located = flows.filter((f) => f.before === before).flatMap((f) => f.locate(preview));
  const parts = [];
  if (located.length) {
    const hits = el('div', 'flow-hits', 'In the flow');
    for (const { node, reveal } of located) {
      const b = el('button', 'btn');
      b.type = 'button';
      b.setAttribute('aria-label', `Show ${node.label} in the flow`);
      if (node.n) b.append(el('span', 'n', node.n));
      b.append(node.label);
      b.addEventListener('click', reveal);
      hits.append(b);
    }
    parts.push(hits);
  }
  const pre = codePre(preview);
  const close = showPanel({
    label: 'Code preview',
    title: [el('code', null, text)],
    href,
    wrap: true,
    body: [...parts, pre],
    onClose: () => {
      button.setAttribute('aria-expanded', 'false');
      for (const f of flows) f.locate(null);
      button.focus({ preventScroll: true });
    },
  });
  button.setAttribute('aria-expanded', 'true');
  close.focus({ preventScroll: true });
  scrollCode(pre);
}
function scrollCode(pre) {
  const first = pre.querySelector('.cited');
  if (first) pre.scrollTop += first.getBoundingClientRect().top - pre.getBoundingClientRect().top
    - 3 * parseFloat(getComputedStyle(pre).lineHeight);
}
for (const code of out.querySelectorAll(':not(pre) > code')) {
  if (!/:\d+(-\d+)?$/.test(code.textContent)) continue;
  const at = cfg.base && code.closest('.panel.before') ? cfg.base : cfg.head || sha;
  const preview = codePreview(code.textContent, at);
  const href = forgeHref(code.textContent, code);
  let reference = code;
  if (href) {
    const a = el('a');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    code.replaceWith(a);
    a.append(code);
    reference = a;
  }
  if (preview) {
    const button = el('button', 'peek');
    button.type = 'button';
    button.title = 'Preview';
    button.innerHTML = EYE;
    button.setAttribute('aria-label', `Preview ${code.textContent}`);
    button.setAttribute('aria-expanded', 'false');
    const before = !!code.closest('.panel.before');
    button.addEventListener('click', () => showCode(code.textContent, preview, href, button, before));
    reference.after(button);
  }
}

// Copies text; falls back to a selected textarea where the clipboard API is blocked (iframes).
async function copy(text, button, done = 'Copied') {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = el('textarea');
    t.value = text;
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.append(t);
    t.select();
    document.execCommand('copy');
    t.remove();
  }
  // A second click before the reset keeps the original content, not the "done" one.
  clearTimeout(button.copied);
  button.dataset.idle ??= button.innerHTML;
  button.innerHTML = done;
  button.copied = setTimeout(() => {
    button.innerHTML = button.dataset.idle;
    delete button.dataset.idle;
  }, 1200);
}

// ```flow blocks: {"nodes": {id: {label, n?, kind?, note?, paths?}}, "tiers": [[{name, ids, note?, flex?}]],
// "edges": [[from, to, label?, style?]]}. kind: existing | added | removed, plus store; style:
// dashed | added | removed.
const NS = 'http://www.w3.org/2000/svg';
let uid = 0;
const nodeKind = (n) => ['removed', 'added', 'existing'].find((k) => (n.kind || '').split(/\s+/).includes(k)) || 'changed';

function legend(spec) {
  const kinds = new Set(Object.values(spec.nodes).map(nodeKind));
  const box = el('div', 'legend');
  if (['existing', 'added', 'removed'].some((k) => kinds.has(k))) {
    for (const [k, text] of [['changed', 'changed by this branch'], ['added', 'new'], ['removed', 'removed'], ['existing', 'unchanged']]) {
      if (!kinds.has(k)) continue;
      const s = el('span');
      s.append(el('i', k), text);
      box.append(s);
    }
  }
  box.append(el('span', null, 'Hover a box to trace its links; click it for its files.'));
  return box;
}

function drawFlow(arch, spec) {
  uid += 1;
  const id = uid;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'edges');
  svg.setAttribute('aria-hidden', 'true');
  const marker = (name, color) => `<marker id="${name}${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(${color})"></path></marker>`;
  svg.innerHTML = `<defs>${marker('a', '--edge')}${marker('h', '--hl')}${marker('g', '--ok')}${marker('r', '--bad')}</defs>`;
  arch.append(svg);

  const boxes = {};
  for (const tier of spec.tiers) {
    const t = el('div', 'tier');
    for (const lane of tier) {
      const l = el('div', 'lane');
      if (lane.flex) l.style.flex = lane.flex;
      l.append(el('span', 'lane-name', lane.name));
      const bx = el('div', 'lane-boxes');
      for (const nid of lane.ids) {
        const n = spec.nodes[nid];
        if (!n || boxes[nid]) continue;
        const b = el('div', `box ${n.kind || ''}`.trim());
        b.tabIndex = 0;
        if (n.n) b.append(el('span', 'n', n.n));
        b.append(el('span', 'label', n.label));
        bx.append(b);
        boxes[nid] = b;
      }
      l.append(bx);
      if (lane.note) l.append(el('span', 'lane-note', lane.note));
      t.append(l);
    }
    arch.append(t);
  }

  const edges = spec.edges.filter((e) => boxes[e[0]] && boxes[e[1]] && e[0] !== e[1]);
  const restMarker = (e) => (e[3] === 'added' ? 'g' : e[3] === 'removed' ? 'r' : 'a');
  const paths = [];
  const labels = [];
  edges.forEach((e, i) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('class', `line ${e[3] || ''}`.trim());
    p.setAttribute('marker-end', `url(#${restMarker(e)}${id})`);
    svg.append(p);
    paths.push(p);
    if (e[2]) {
      const lb = el('span', `edge-label ${e[3] || ''}`.trim(), e[2]);
      arch.append(lb);
      labels[i] = lb;
    }
  });

  function draw() {
    const base = arch.getBoundingClientRect();
    svg.setAttribute('width', base.width);
    svg.setAttribute('height', base.height);
    const R = {};
    for (const k of Object.keys(boxes)) {
      const r = boxes[k].getBoundingClientRect();
      R[k] = { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height };
    }
    // Each edge leaves and enters a box side; edges sharing a side spread along it.
    const ports = {};
    edges.forEach((e, i) => {
      const a = R[e[0]], b = R[e[1]];
      const acy = a.y + a.h / 2, bcy = b.y + b.h / 2;
      let sa, sb;
      if (Math.abs(acy - bcy) < 8) [sa, sb] = a.x < b.x ? ['right', 'left'] : ['left', 'right'];
      else [sa, sb] = bcy > acy ? ['bottom', 'top'] : ['top', 'bottom'];
      for (const [nid, side, other, self] of [[e[0], sa, b, 0], [e[1], sb, a, 1]]) {
        (ports[`${nid}:${side}`] ||= []).push({ i, other, self });
      }
    });
    const pos = {};
    for (const key of Object.keys(ports)) {
      const [nid, side] = key.split(':');
      const r = R[nid];
      const list = ports[key];
      const horiz = side === 'top' || side === 'bottom';
      list.sort((p, q) => (horiz ? (p.other.x + p.other.w / 2) - (q.other.x + q.other.w / 2) : p.other.y - q.other.y));
      list.forEach((p, k) => {
        const f = (k + 1) / (list.length + 1);
        const x = side === 'left' ? r.x : side === 'right' ? r.x + r.w : r.x + r.w * f;
        const y = side === 'top' ? r.y : side === 'bottom' ? r.y + r.h : r.y + r.h * f;
        pos[`${p.i}:${p.self}`] = { x, y, side };
      });
    }
    edges.forEach((e, i) => {
      const s = pos[`${i}:0`], t = pos[`${i}:1`];
      let ex = t.x, ey = t.y;
      if (t.side === 'top') ey -= 4; else if (t.side === 'bottom') ey += 4; else if (t.side === 'left') ex -= 4; else ex += 4;
      let d;
      if (s.side === 'top' || s.side === 'bottom') {
        const dy = Math.max(30, Math.abs(ey - s.y) / 2), sg = s.side === 'bottom' ? 1 : -1;
        d = `M${s.x},${s.y} C${s.x},${s.y + sg * dy} ${ex},${ey - sg * dy} ${ex},${ey}`;
      } else {
        const dx = Math.max(30, Math.abs(ex - s.x) / 2), sx = s.side === 'right' ? 1 : -1;
        d = `M${s.x},${s.y} C${s.x + sx * dx},${s.y} ${ex - sx * dx},${ey} ${ex},${ey}`;
      }
      paths[i].setAttribute('d', d);
      if (labels[i]) {
        const m = paths[i].getPointAtLength(paths[i].getTotalLength() / 2);
        // Centred on the edge, but shifted inward when that would cut it off at the diagram's side.
        const half = labels[i].offsetWidth / 2, pad = 4;
        labels[i].style.left = `${Math.min(Math.max(m.x, half + pad), base.width - half - pad)}px`;
        labels[i].style.top = `${s.side === 'left' || s.side === 'right' ? m.y - 13 : m.y}px`;
      }
    });
  }

  function focusOn(nid) {
    arch.classList.add('focus');
    boxes[nid].classList.add('near');
    edges.forEach((e, i) => {
      const on = e[0] === nid || e[1] === nid;
      paths[i].classList.toggle('on', on);
      paths[i].setAttribute('marker-end', `url(#${on ? 'h' : restMarker(e)}${id})`);
      if (labels[i]) labels[i].classList.toggle('on', on);
      if (on) { boxes[e[0]].classList.add('near'); boxes[e[1]].classList.add('near'); }
    });
  }
  function clear() {
    arch.classList.remove('focus');
    for (const b of Object.values(boxes)) b.classList.remove('near');
    edges.forEach((e, i) => {
      paths[i].classList.remove('on');
      paths[i].setAttribute('marker-end', `url(#${restMarker(e)}${id})`);
      if (labels[i]) labels[i].classList.remove('on');
    });
  }
  // Click (or Enter) pins a box: its links stay traced and the panel lists its files.
  let pinned = null;
  function showDetail(k) {
    const n = spec.nodes[k];
    const title = [];
    if (n.n) title.push(el('span', 'n', n.n));
    title.push(el('span', null, n.label));
    const kind = nodeKind(n);
    title.push(el('span', 'detail-kind', { changed: n.n ? 'changed' : '', added: 'new', removed: 'removed', existing: 'unchanged' }[kind]));
    const body = el('div', 'detail-body');
    let previews = false;
    if (n.note) body.append(el('p', 'detail-note', n.note));
    const paths = Array.isArray(n.paths) ? n.paths : [];
    if (!paths.length) body.append(el('p', 'none', 'No file given for this box.'));
    else {
      const list = el('ul', 'paths');
      for (const p of paths) {
        const li = el('li');
        li.append(el('code', null, p));
        const b = iconButton(COPY, 'Copy path');
        b.addEventListener('click', () => copy(p, b, CHECK));
        li.append(b);
        const at = cfg.base && arch.closest('.panel.before') ? cfg.base : cfg.head || sha;
        const preview = codePreview(p, at);
        if (preview) {
          previews = true;
          const button = iconButton(EYE, 'Preview');
          button.setAttribute('aria-label', `Preview ${p}`);
          button.setAttribute('aria-expanded', 'false');
          button.addEventListener('click', () => {
            const pre = li.querySelector('pre.code');
            if (pre) pre.remove();
            else {
              const pre = codePre(preview);
              li.append(pre);
              scrollCode(pre);
            }
            sidePanel.classList.toggle('single-preview', sidePanel.querySelectorAll('pre.code').length === 1);
            button.title = pre ? 'Preview' : 'Hide preview';
            button.setAttribute('aria-expanded', String(!pre));
          });
          li.append(button);
        }
        const href = forgeHref(p, arch);
        if (href) li.append(openLink(href));
        list.append(li);
      }
      body.append(list);
      if (paths.length > 1) {
        const all = el('button', 'btn', 'Copy all');
        all.type = 'button';
        all.style.alignSelf = 'flex-start';
        all.addEventListener('click', () => copy(paths.join('\n'), all));
        body.append(all);
      }
    }
    // Opening the panel first closes whatever it showed, including this flow's previous pin.
    return showPanel({ label: `${n.label} files`, title, wrap: previews, live: true, body: [body], onClose: unpinned });
  }
  function unpinned() {
    const back = sidePanel.contains(document.activeElement) ? boxes[pinned] : null;
    boxes[pinned].classList.remove('pinned');
    pinned = null;
    clear();
    back?.focus();
  }
  // The card sits at the end of body, so a keyboard pin moves focus into it and closing it from
  // inside returns focus to the box.
  function pin(k, fromKey) {
    const close = showDetail(k);
    pinned = k;
    clear();
    focusOn(k);
    boxes[k].classList.add('pinned');
    if (fromKey) close.focus({ preventScroll: true });
  }
  function unpin() {
    if (pinned) closePanel?.();
  }
  for (const [k, b] of Object.entries(boxes)) {
    b.setAttribute('role', 'button');
    b.setAttribute('aria-label', `${spec.nodes[k].n ? `${spec.nodes[k].n} ` : ''}${spec.nodes[k].label}: show files`);
    b.addEventListener('mouseenter', () => { if (!pinned) focusOn(k); });
    b.addEventListener('mouseleave', () => { if (!pinned) clear(); });
    b.addEventListener('focus', () => { if (!pinned) focusOn(k); });
    b.addEventListener('blur', () => { if (!pinned) clear(); });
    b.addEventListener('click', (ev) => { ev.stopPropagation(); if (pinned === k) unpin(); else pin(k); });
    b.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (pinned === k) unpin(); else pin(k, true); }
    });
  }
  arch.addEventListener('click', unpin);
  draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  if (window.ResizeObserver) new ResizeObserver(draw).observe(arch);
  else window.addEventListener('resize', draw);

  // Highlights the boxes that hold a previewed path:line (only the best match: lines, then file,
  // then folder) and returns them with a way to scroll to each; null clears the highlight.
  return function locate(preview) {
    for (const b of Object.values(boxes)) b.classList.remove('located');
    if (!preview) return [];
    const { path, from, to } = preview;
    let best = 0;
    let keys = [];
    for (const k of Object.keys(boxes)) {
      const paths = Array.isArray(spec.nodes[k].paths) ? spec.nodes[k].paths : [];
      const score = Math.max(0, ...paths.map((p) => pathScore(p, path, from, to)));
      if (!score || score < best) continue;
      if (score > best) [best, keys] = [score, []];
      keys.push(k);
    }
    return keys.map((k) => {
      boxes[k].classList.add('located');
      const reveal = () => {
        const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
        // On phones the preview is a bottom sheet, so the box goes to the top of the screen.
        boxes[k].scrollIntoView({ block: innerWidth <= 640 ? 'start' : 'center', behavior: smooth ? 'smooth' : 'auto' });
        boxes[k].focus({ preventScroll: true });
      };
      return { node: spec.nodes[k], reveal };
    });
  };
}

for (const code of out.querySelectorAll('pre > code.language-flow')) {
  const pre = code.parentElement;
  let spec;
  try {
    spec = JSON.parse(code.textContent);
    if (!spec || typeof spec.nodes !== 'object' || !Array.isArray(spec.tiers)) throw new Error('needs "nodes" and "tiers"');
    spec.edges ||= [];
  } catch (err) {
    pre.before(el('p', 'flow-error', `Flow diagram not drawn: ${err.message}`));
    continue;
  }
  const flow = el('div', 'flow');
  const scroll = el('div', 'arch-scroll');
  const arch = el('div', 'arch');
  const before = !!pre.closest('.panel.before');
  scroll.append(arch);
  flow.append(scroll, legend(spec));
  pre.replaceWith(flow);
  flows.push({ before, locate: drawFlow(arch, spec) });
}

// Older overviews may still use mermaid; load it only when one is there.
const mermaidBlocks = out.querySelectorAll('pre > code.language-mermaid');
if (mermaidBlocks.length) {
  for (const code of mermaidBlocks) {
    const pre = code.parentElement;
    pre.className = 'mermaid';
    pre.textContent = code.textContent;
  }
  const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs');
  const theme = document.documentElement.dataset.theme;
  const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const font = getComputedStyle(document.body);
  mermaid.initialize({
    startOnLoad: false,
    theme: dark ? 'dark' : 'default',
    securityLevel: 'strict',
    themeVariables: { fontSize: font.fontSize, fontFamily: font.fontFamily },
    flowchart: { useMaxWidth: false },
  });
  await mermaid.run({ querySelector: 'pre.mermaid' });
}
</script>
</body>
