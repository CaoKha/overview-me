[package]
name = "change-map"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Spec-linked change maps for reviewing agent-written code"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
