name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The same install the README gives users, so a green main means `cargo install` works.
      - name: cargo install
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/bin/overview-me" --version

  plugin:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Checks .claude-plugin/plugin.json, marketplace.json and the skills' frontmatter.
      - run: npx -y @anthropic-ai/claude-code plugin validate .
        env:
          DISABLE_TELEMETRY: "1"
