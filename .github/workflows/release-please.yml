name: Release Please

# On every push to main, release-please keeps a "release vX.Y.Z" PR open that bumps Cargo.toml,
# Cargo.lock and .claude-plugin/plugin.json from the conventional commits since the last release.
# Merging that PR tags the release; this workflow then builds and attaches the CLI binaries.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so call the release build here.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
